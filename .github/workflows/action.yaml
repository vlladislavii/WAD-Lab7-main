name: Lab 7

# Task 4: the pipeline runs only when pushing to (or opening a PR against) the "test" branch
on:
  # workflow should be triggered only when pushing on a specific branch
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: gradle

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      # Task 1: run all backend tests in the pipeline
      # Task 2: pass the GitHub secret to the tests as an environment variable (for the environment() test)
      - name: Run backend tests
        run: ./gradlew test
        env:
          VLAD: ${{ secrets.VLAD }}

      # Task 3: generate the JaCoCo coverage report
      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/